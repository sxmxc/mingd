services:
  web:
    image: ${IMAGE_PREFIX:-mingd}/web:${WEB_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in .env}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in .env}
      REDIS_URL: redis://redis:6379
      BUILDER_QUEUE_NAME: ${BUILDER_QUEUE_NAME:-godot-builds}
      WEB_BUILDER_QUEUE_NAME: ${WEB_BUILDER_QUEUE_NAME:-godot-web-builds}
      ANDROID_BUILDER_QUEUE_NAME: ${ANDROID_BUILDER_QUEUE_NAME:-godot-android-builds}
      MACOS_BUILDER_QUEUE_NAME: ${MACOS_BUILDER_QUEUE_NAME:-godot-macos-builds}
      MACOS_TOOLCHAIN_SHA256: ${MACOS_TOOLCHAIN_SHA256:-}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-build-artifacts}
      SIGNED_DOWNLOAD_TTL_SECONDS: ${SIGNED_DOWNLOAD_TTL_SECONDS:-900}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3

  worker-gateway:
    image: ${IMAGE_PREFIX:-mingd}/worker-gateway:${WORKER_GATEWAY_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    profiles: ["gateway"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/worker-gateway/Dockerfile
    environment:
      WORKER_GATEWAY_HOST: 0.0.0.0
      WORKER_GATEWAY_PORT: 3001
      WORKER_GATEWAY_LOG_LEVEL: ${WORKER_GATEWAY_LOG_LEVEL:-info}
      WORKER_GATEWAY_WORKERS_ENABLED: ${WORKER_GATEWAY_WORKERS_ENABLED:-false}
      WORKER_GATEWAY_EXECUTION_ENABLED: ${WORKER_GATEWAY_EXECUTION_ENABLED:-false}
      REDIS_URL: redis://redis:6379
      BUILDER_QUEUE_NAME: ${BUILDER_QUEUE_NAME:-godot-builds}
      WEB_BUILDER_QUEUE_NAME: ${WEB_BUILDER_QUEUE_NAME:-godot-web-builds}
      ANDROID_BUILDER_QUEUE_NAME: ${ANDROID_BUILDER_QUEUE_NAME:-godot-android-builds}
      MACOS_BUILDER_QUEUE_NAME: ${MACOS_BUILDER_QUEUE_NAME:-godot-macos-builds}
      MACOS_TOOLCHAIN_SHA256: ${MACOS_TOOLCHAIN_SHA256:-}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-build-artifacts}
      BUILDER_DRY_RUN: ${BUILDER_DRY_RUN:-false}
      WORKER_GATEWAY_QUEUE_CONCURRENCY: ${WORKER_GATEWAY_QUEUE_CONCURRENCY:-16}
      WORKER_GATEWAY_MAX_UPLOADS: ${WORKER_GATEWAY_MAX_UPLOADS:-2}
      WORKER_GATEWAY_MAX_JOB_MS: ${WORKER_GATEWAY_MAX_JOB_MS:-43200000}
      SUPABASE_URL: ${SUPABASE_URL:-${NEXT_PUBLIC_SUPABASE_URL:-}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in .env}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WORKER_GATEWAY_PORT:-3001}:3001"
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3

  maintenance:
    image: ${IMAGE_PREFIX:-mingd}/maintenance:${MAINTENANCE_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/builder/Dockerfile.maintenance
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in .env}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-build-artifacts}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    cpus: 1
    pids_limit: 64

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  builder:
    image: ${IMAGE_PREFIX:-mingd}/builder:${BUILDER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    profiles: ["builder"]
    build:
      context: .
      dockerfile: services/builder/Dockerfile
      target: desktop
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      BUILDER_TARGET: desktop
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - godot-source-cache:/cache/godot
      - ccache:/cache/ccache
      - builder-work:/work/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web-builder:
    image: ${IMAGE_PREFIX:-mingd}/web-builder:${WEB_BUILDER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    profiles: ["builder"]
    build:
      context: .
      dockerfile: services/builder/Dockerfile
      target: web
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      BUILDER_TARGET: web
      BUILDER_QUEUE_NAME: ${WEB_BUILDER_QUEUE_NAME:-godot-web-builds}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - web-godot-source-cache:/cache/godot
      - web-ccache:/cache/ccache
      - web-builder-work:/work/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  android-builder:
    image: ${IMAGE_PREFIX:-mingd}/android-builder:${ANDROID_BUILDER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    profiles: ["builder"]
    build:
      context: .
      dockerfile: services/builder/Dockerfile
      target: android
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      BUILDER_TARGET: android
      BUILDER_QUEUE_NAME: ${ANDROID_BUILDER_QUEUE_NAME:-godot-android-builds}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - android-godot-source-cache:/cache/godot
      - android-ccache:/cache/ccache
      - android-gradle:/cache/gradle
      - android-builder-work:/work/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  macos-builder:
    image: ${IMAGE_PREFIX:-mingd}/macos-builder:${MACOS_BUILDER_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    profiles: ["macos-builder"]
    build:
      context: .
      dockerfile: services/builder/Dockerfile
      target: macos
      args:
        MACOS_TOOLCHAIN_SHA256: ${MACOS_TOOLCHAIN_SHA256:-}
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      BUILDER_TARGET: macos
      BUILDER_QUEUE_NAME: ${MACOS_BUILDER_QUEUE_NAME:-godot-macos-builds}
      MACOS_TOOLCHAIN_SHA256: ${MACOS_TOOLCHAIN_SHA256:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - macos-godot-source-cache:/cache/godot
      - macos-ccache:/cache/ccache
      - macos-builder-work:/work/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis-data:
  godot-source-cache:
  ccache:
  builder-work:
  web-godot-source-cache:
  web-ccache:
  web-builder-work:
  android-godot-source-cache:
  android-ccache:
  android-gradle:
  android-builder-work:
  macos-godot-source-cache:
  macos-ccache:
  macos-builder-work:
