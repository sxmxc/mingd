services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  builder:
    profiles: ["builder"]
    build:
      context: .
      dockerfile: services/builder/Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - godot-source-cache:/cache/godot
      - ccache:/cache/ccache
      - builder-work:/work/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis-data:
  godot-source-cache:
  ccache:
  builder-work:
