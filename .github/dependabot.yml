version: 2

updates:
  # One root lockfile covers the npm workspaces.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types: [minor, patch]

      supabase:
        patterns:
          - "@supabase/*"
          - supabase
        update-types: [minor, patch]

      documentation:
        patterns:
          - astro
          - "@astrojs/*"
        update-types: [minor, patch]

      other-npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images, including the compiler toolchain.
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/builder
      - /services/worker-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Maintain Redis without touching app image release tags.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: redis
