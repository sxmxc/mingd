name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks (Node 24)
    # Pull request branch filters match the base; check the source branch here.
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'doc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate Next.js route types
        run: npm exec --workspace @mingd/web -- next typegen
      - run: npm run typecheck
      - run: npm test
      - name: Build production application
        run: npm run build --workspace @mingd/web

  database:
    name: Database migrations and SQL tests
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'doc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start disposable Supabase database
        # SQL tests only need Postgres; skip API, UI, and other services.
        run: npx supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reapply all migrations from scratch
        run: npx supabase db reset --local --no-seed --yes
      - name: Test ownership, access policies, and maintenance
        run: npx supabase test db --local
      - name: Stop disposable Supabase database
        if: always()
        run: npx supabase stop --no-backup

  containers:
    name: Docker build (${{ matrix.image }})
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'doc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: maintenance
            dockerfile: services/builder/Dockerfile.maintenance
          - image: worker-gateway
            dockerfile: services/worker-gateway/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set repository image namespace
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_PREFIX=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:ci
          build-args: |
            MINGD_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            MINGD_IMAGE_TAG=ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
